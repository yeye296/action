name: 构建 Uptime Kuma ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.2.0)'
        required: false
        default: ''

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/louislam/uptime-kuma/releases/latest | jq -r '.tag_name')
          fi
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to get version"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Download source
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fSL "https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz
          mv uptime-kuma-* uptime-kuma-src
      
      - name: Build ARM64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/uptime-kuma-src:/src:ro" \
            -v "$PWD/output:/output" \
            -e VERSION="$VERSION" \
            arm64v8/node:18-bookworm bash -c '
              set -e
              
              echo "=========================================="
              echo "  ARM64 Build - Uptime Kuma"
              echo "  Arch: $(uname -m)"
              echo "  Node: $(node -v)"
              echo "=========================================="
              
              # 安装编译工具
              apt-get update -qq
              apt-get install -y -qq python3 build-essential g++ make file > /dev/null
              echo "✓ Build tools installed"
              
              cp -r /src /build
              cd /build
              
              echo ""
              echo "[1/6] Installing all dependencies..."
              npm ci --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Dependencies installed"
              
              echo ""
              echo "[2/6] Building frontend..."
              npm run build 2>&1 | tail -5
              echo "✓ Frontend built"
              
              echo ""
              echo "[3/6] Removing node_modules..."
              rm -rf node_modules
              
              echo ""
              echo "[4/6] Installing production deps..."
              npm ci --omit=dev --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Production deps installed"
              
              echo ""
              echo "[5/6] Rebuilding sqlite3 for ARM64..."
              
              # 进入 sqlite3 目录重新编译
              cd node_modules/@louislam/sqlite3
              
              # 查看当前状态
              echo "Current binding directory:"
              ls -la lib/binding/ 2>/dev/null || echo "No binding dir yet"
              
              # 使用 node-pre-gyp 重新编译
              npx --yes node-pre-gyp rebuild --build-from-source 2>&1 | tail -20
              
              # 检查编译结果
              echo ""
              echo "After rebuild:"
              find . -name "*.node" -type f 2>/dev/null
              ls -la lib/binding/ 2>/dev/null || true
              
              cd /build
              
              echo ""
              echo "[6/6] Verifying ARM64 binding..."
              
              # 查找 binding 文件
              echo "Searching for node_sqlite3.node..."
              find node_modules -name "node_sqlite3.node" -type f 2>/dev/null
              
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              if [ -z "$BINDING" ]; then
                echo ""
                echo "[ERROR] sqlite3 binding not found!"
                echo ""
                echo "All .node files:"
                find node_modules -name "*.node" -type f 2>/dev/null
                echo ""
                echo "sqlite3 directory structure:"
                ls -laR node_modules/@louislam/sqlite3/lib/ 2>/dev/null || true
                exit 1
              fi
              
              echo ""
              echo "Found binding: $BINDING"
              file "$BINDING"
              
              if ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "[ERROR] Binding is not ARM64!"
                exit 1
              fi
              
              # 确认路径正确
              EXPECTED_PATH="node_modules/@louislam/sqlite3/lib/binding/napi-v6-linux-arm64/node_sqlite3.node"
              if [ ! -f "$EXPECTED_PATH" ]; then
                echo ""
                echo "[WARN] Binding not in expected path, creating..."
                mkdir -p "$(dirname $EXPECTED_PATH)"
                cp "$BINDING" "$EXPECTED_PATH"
                echo "✓ Copied to $EXPECTED_PATH"
              fi
              
              echo "✓ ARM64 binding verified"
              
              # 清理（小心不要删除 binding）
              echo ""
              echo "Cleaning up..."
              rm -rf .git .github test docker .devcontainer
              rm -f *.md CNAME compose.yaml 2>/dev/null || true
              
              # 最终验证
              echo ""
              echo "Final verification:"
              FINAL_BINDING="node_modules/@louislam/sqlite3/lib/binding/napi-v6-linux-arm64/node_sqlite3.node"
              if [ ! -f "$FINAL_BINDING" ]; then
                echo "[FATAL] Binding missing after cleanup!"
                exit 1
              fi
              
              ls -la "$FINAL_BINDING"
              file "$FINAL_BINDING"
              
              echo ""
              echo "=========================================="
              echo "  Build Complete!"
              echo "  Size: $(du -sh . | cut -f1)"
              echo "=========================================="
              
              mkdir -p /output
              cp -r /build /output/uptime-kuma
            '
      
      - name: Verify output
        run: |
          echo "Checking output..."
          BINDING="output/uptime-kuma/node_modules/@louislam/sqlite3/lib/binding/napi-v6-linux-arm64/node_sqlite3.node"
          
          if [ ! -f "$BINDING" ]; then
            echo "ERROR: Binding not found in output!"
            find output -name "*.node" -type f
            exit 1
          fi
          
          echo "✓ Binding exists: $BINDING"
          file "$BINDING"
      
      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cd output
          tar -czf "../uptime-kuma-${VERSION}-arm64.tar.gz" uptime-kuma
          cd ..
          
          ls -lh *.tar.gz
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: uptime-kuma-*-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
